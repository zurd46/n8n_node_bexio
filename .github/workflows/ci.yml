name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24: isolated-vm (dev dependency of @n8n/node-cli) does not build on Node 26
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # Native install scripts are not needed for lint/build/publish
        run: npm ci --ignore-scripts

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build
